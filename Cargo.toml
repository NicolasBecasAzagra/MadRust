[workspace]
resolver = "2"
members = [
    "madrust-arch",
    "madrust-bootinfo",
    "madrust-drivers",
    "madrust-elf",
    "madrust-initramfs",
    "madrust-kernel",
    "madrust-mm",
    "madrust-sched",
]
# Crates that carry their own workspace must be named here, or the paths that
# point into them make cargo see two workspace roots in the same tree.
exclude = ["madrust-net", "madrust-http"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = false
