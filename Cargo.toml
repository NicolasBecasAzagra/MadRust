[workspace]
resolver = "2"
members = [
    "madrust-arch",
    "madrust-bootinfo",
    "madrust-drivers",
    "madrust-elf",
    "madrust-kernel",
    "madrust-mm",
    "madrust-sched",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = false
