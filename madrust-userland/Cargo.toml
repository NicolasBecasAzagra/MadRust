# SPDX-License-Identifier: GPL-2.0-only
[package]
name = "madrust-userland"
description = "Standard library MadRust ring 3 test program"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
publish = false

# The program is a separate workspace: it is a normal Rust program for the
# Linux musl target, so it shares neither the kernel target nor the kernel
# rustflags. The Makefile builds it with rust-lld and embeds the static
# position independent executable in the kernel.
[workspace]

[[bin]]
name = "madrust-userland"
path = "src/main.rs"
test = false
bench = false

[profile.release]
panic = "abort"
opt-level = 2
lto = false
