# Cargo configuration for the MadRust workspace.
#
# The bare-metal target and the `-Z build-std` flags are deliberately NOT set
# here: they are passed on the command line by the Makefile, so that plain
# `cargo test` and `cargo clippy` keep working on the host inside this
# workspace. The kernel-only crates are excluded from the host runs.

[unstable]
json-target-spec = true

[target.x86_64-madrust]
rustflags = ["-C", "link-arg=-Tlinker.ld"]

# The user program is linked at 0x400000 by the script next to its manifest.
# Cargo runs the linker for that package with `madrust-userland` as the working
# directory, so the script name is relative to the crate, not to this file.
[target.x86_64-madrust-user]
rustflags = ["-C", "link-arg=-Tuserland.ld"]

[alias]
kbuild = "build --release --target x86_64-madrust.json -Z build-std=core,compiler_builtins -Z build-std-features=compiler-builtins-mem"
