# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build, lint, test and boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: rust-src, llvm-tools, rustfmt, clippy
          # The user program is a standard library program for Linux musl.
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio

      - name: Check formatting
        run: make fmt-check

      - name: Clippy
        run: make clippy

      - name: Clippy (host)
        run: make clippy-host

      - name: Host tests
        run: make test

      - name: Build kernel
        run: make build

      - name: Verify PVH ELF note
        run: |
          SYSROOT="$(rustc --print sysroot)"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          READOBJ="$SYSROOT/lib/rustlib/$HOST/bin/llvm-readobj"
          "$READOBJ" --notes "$(make -s print-kernel-path)" | tee note.txt
          # The note owner and type are what QEMU looks for; the wording of the
          # tool output changes between LLVM releases, so match on the values.
          grep -q 'Xen' note.txt
          grep -q '0x00000012' note.txt

      - name: Boot kernel in QEMU
        run: |
          set +e
          # A broken kernel would hang here forever, so the boot is bounded.
          timeout 60 qemu-system-x86_64 -M q35 -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -display none -monitor none -no-reboot \
            -serial file:serial.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat serial.log
          test "$status" -eq 33
          # The kernel and the program write to the same serial port, and the
          # two interleave at the byte level: a line of the program can arrive
          # behind a line of the kernel. The prefix of the kernel is cut
          # before the exact matches, so the gate does not depend on where
          # the two streams meet.
          tr -d '\r' < serial.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > serial-clean.log
          grep -q "MadRust: boot OK" serial-clean.log
          # The kernel must run from the higher half and reach physical memory
          # through the direct map only.
          grep -q "0xffffffff80000000" serial-clean.log
          grep -q "MM DIRECTMAP OK" serial-clean.log
          grep -q "\[mem\] RAM" serial-clean.log
          grep -q "MEM OK" serial-clean.log
          grep -q "HEAP OK 10000" serial-clean.log
          # The user program prints through the write system call and exits
          # through exit_group; the kernel reports the status it received.
          grep -q "Hello from MadRust userland" serial-clean.log
          grep -q "USER OK exit=0" serial-clean.log
          grep -q "SCHED OK" serial-clean.log
          # Interleaving proof: every demo thread must appear in the log.
          grep -q "^T1 " serial-clean.log
          grep -q "^T2 " serial-clean.log
          grep -q "^T3 " serial-clean.log
          grep -q "DIV0" serial-clean.log
          grep -q "TICKS 100" serial-clean.log

      - name: Boot kernel with a network device
        run: |
          # The guest has no firmware, so the kernel enumerates the bus by
          # itself. This boot attaches a network device and asserts that the
          # enumeration names it next to the bridge of the host.
          set +e
          timeout 60 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -device virtio-net-pci,netdev=n0 -netdev user,id=n0 \
            -object filter-dump,id=dump0,netdev=n0,file=net.pcap \
            -display none -monitor none -no-reboot \
            -serial file:pci.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat pci.log
          test "$status" -eq 33
          tr -d '\r' < pci.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > pci-boot.log
          # One line per function that answers, with the vendor and the device
          # id as four hexadecimal digits each.
          grep -qE "^\[pci\] [0-9a-f]{2}:[0-9a-f]{2}\.[0-7] [0-9a-f]{4}:[0-9a-f]{4} class [0-9a-f]{6}$" pci-boot.log
          grep -q "^\[pci\] 00:1f.0 8086:29c0 " pci-boot.log
          grep -q " 1af4:1000 " pci-boot.log
          # The kernel claims the legacy port window of the card and reports
          # the base it assigned, the size the device asked for, the features
          # it offers and its hardware address. QEMU's address starts with
          # 52:54:00, the prefix of the host side of the emulated card.
          grep -qE "^\[virtio\] net base=0x[0-9a-f]{4} size=32 features=0x[0-9a-f]{8} mac=52:54:00(:[0-9a-f]{2}){3}$" pci-boot.log
          # The device is then brought up and given a ring per direction. The
          # legacy interface fixes the queue size, so the driver lays each
          # ring out for the number the device reports and both numbers of a
          # line are the same.
          grep -qE "^\[virtio\] queue 0 base=0x[0-9a-f]{12} descriptors=[0-9]+ max=[0-9]+$" pci-boot.log
          grep -qE "^\[virtio\] queue 1 base=0x[0-9a-f]{12} descriptors=[0-9]+ max=[0-9]+$" pci-boot.log
          # One frame is handed to the transmit queue and the device reports it
          # back through the used ring: descriptor zero, the length the device
          # chose to report and one frame moved.
          grep -qE "^\[virtio\] tx queue=1 desc=0 len=[0-9]+ used=1$" pci-boot.log
          grep -qxF "MadRust: boot OK" pci-boot.log
          # The frame must also leave the guest. The dump is written by the
          # emulator at the boundary of its user mode network, so it holds what
          # arrived there and what the host answered: the address resolution
          # request for the gateway, and the reply of the gateway.
          python3 - <<'PY'
          import struct
          import sys

          with open("net.pcap", "rb") as dump:
              data = dump.read()

          # A libpcap file: a magic number, then a header and the bytes of each
          # packet. QEMU writes the little endian variant.
          if data[:4] != b"\xd4\xc3\xb2\xa1":
              sys.exit("net.pcap is not a little endian libpcap file")
          offset = 24
          frames = []
          while offset + 16 <= len(data):
              _, _, captured, _ = struct.unpack("<IIII", data[offset : offset + 16])
              offset += 16
              frames.append(data[offset : offset + captured])
              offset += captured

          def arp(frame):
              # Broadcast destination, the type of an address resolution
              # packet, Ethernet hardware on IPv4 and one of its two operations.
              if len(frame) < 42 or frame[0:6] != b"\xff" * 6:
                  return None
              if frame[12:14] != b"\x08\x06" or frame[14:18] != b"\x00\x01\x08\x00":
                  return None
              return frame

          request = [
              frame
              for frame in frames
              if (arp(frame) is not None
                  and frame[20:22] == b"\x00\x01"
                  and frame[28:32] == bytes([10, 0, 2, 15])
                  and frame[38:42] == bytes([10, 0, 2, 2]))
          ]
          if not request:
              sys.exit("no address resolution request for 10.0.2.2 reached the network")
          reply = [
              frame
              for frame in frames
              if (arp(frame) is not None
                  and frame[20:22] == b"\x00\x02"
                  and frame[28:32] == bytes([10, 0, 2, 2]))
          ]
          if not reply:
              sys.exit("the gateway did not answer the address resolution request")
          print("NET FRAME OK sent=%d received=%d" % (len(request[0]), len(frames)))
          PY

      - name: Boot kernel with four processors
        run: |
          # The multiprocessor path has its own race, so it is a gate of its
          # own and not a variation of the single processor boot.
          set +e
          timeout 120 qemu-system-x86_64 -M q35 -cpu Skylake-Client -smp 4 -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -display none -monitor none -no-reboot \
            -serial file:smp.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat smp.log
          # The exit status of the emulator is the code the kernel writes to
          # the debug exit port: 33 means the boot reached its end. The shell
          # must not stop on that number, or the gate fails on a good boot.
          test "$status" -eq 33
          grep -q "SMP processors=4" smp.log
          grep -q "SMP OK cpus=4" smp.log

      - name: Boot kernel with the initramfs
        run: |
          # The weights workload touches the whole region it measures, so the
          # CI builds it with a small region to finish under emulation.
          make bench BENCH_FEATURES=small
          sh bench/mkinitramfs.sh
          expected="$(wc -c < madrust-bench/madrust-bench.elf | tr -d ' ')"
          set +e
          # The benchmark workload touches 256 MiB five times, so this boot is
          # slower than the bare one under emulation.
          timeout 300 qemu-system-x86_64 -M q35 -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd bench/initramfs.cpio \
            -display none -monitor none -no-reboot \
            -serial file:initramfs.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat initramfs.log
          test "$status" -eq 33
          # Normalise the CRLF of the kernel lines and cut the prefix of the
          # kernel log: the workload and the kernel share the serial port and
          # their lines can meet.
          tr -d '\r' < initramfs.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > initramfs-boot.log
          # One module, and as many files and entries as the archive holds: the
          # count changes when the archive gains alignment files.
          grep -qE "^\[user\] initramfs: 1 module, [0-9]+ files, [0-9]+ entries$" initramfs-boot.log
          grep -qxF "FILE size=$expected" initramfs-boot.log
          grep -qxF "FILE mode=33261" initramfs-boot.log
          grep -qxF "FILE path-size=$expected" initramfs-boot.log
          grep -qxF "FILE read=$expected" initramfs-boot.log
          grep -qxF "FILE seek=$expected" initramfs-boot.log
          grep -qxF "FILE missing=-2" initramfs-boot.log
          grep -qxF "BENCH DONE" initramfs-boot.log
          # The file mapping covers the file rounded down to whole pages, and
          # the first byte of the file is the ELF magic.
          grep -qxF "FILE mmap=$(( expected / 4096 * 4096 ))" initramfs-boot.log
          grep -qxF "FILE mmap-byte=127" initramfs-boot.log
          grep -q "large pages mapped" initramfs-boot.log
          # Every sample still prints, with the count each workload owes.
          declare -A samples=(
            [syscall]=30 [mmap]=30 [futex]=30 [threads]=30
            [weights]=5 [weights-tail]=5 [weights-huge]=10 [weights-huge-tail]=10
          )
          total=0
          for workload in "${!samples[@]}"; do
            count="$(grep -c "^RESULT $workload " initramfs-boot.log || true)"
            echo "$workload: $count samples"
            test "$count" -eq "${samples[$workload]}"
            total=$((total + count))
          done
          test "$total" -eq "$(grep -c '^RESULT ' initramfs-boot.log)"
          grep -qxF "USER OK exit=0" initramfs-boot.log
          grep -qxF "MadRust: boot OK" initramfs-boot.log

      - name: Boot the inference runtime in the guest
        run: |
          # The runtime serves a model from the initramfs and prints the
          # tokens it generated. The gate is that the runtime runs inside the
          # guest and answers, not that the answer is good: the model of this
          # run is the synthetic one.
          make infer infer-model infer-initramfs
          set +e
          timeout 300 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 1024M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd madrust-infer/initramfs.cpio \
            -display none -monitor none -no-reboot \
            -serial file:infer.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat infer.log
          test "$status" -eq 33
          # The kernel writes its lines with a carriage return at the end and
          # the program writes its lines without one, so the log has both.
          tr -d '\r' < infer.log > infer-boot.log
          grep -q "^INFER OK" infer-boot.log
          grep -q "^INFER ttft_ms " infer-boot.log
          grep -q "^INFER tok_per_s " infer-boot.log
          grep -qxF "MadRust: boot OK" infer-boot.log

      - name: Run the agent loop in the guest
        run: |
          # The agent is the fourth program: it asks the model for a tool
          # call, runs the tool and goes on. The gate is that the loop runs
          # and reports, not that the model decides well: the model of this
          # run is the synthetic one, whose answers are arbitrary.
          make agent agent-initramfs
          set +e
          timeout 600 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 1024M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd madrust-agent/initramfs.cpio \
            -display none -monitor none -no-reboot \
            -serial file:agent.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat agent.log
          test "$status" -eq 33
          # The kernel writes its lines with a carriage return at the end and
          # the program writes its lines without one, so the log has both.
          tr -d '\r' < agent.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > agent-boot.log
          # Every step of the loop reports its tool and its result, and the
          # run ends with the summary the rig reads.
          grep -q "^AGENT step=1 tool=" agent-boot.log
          grep -qE "^AGENT steps=[0-9]+ tokens=[0-9]+ seconds=[0-9.]+ tool_calls=[0-9]+$" agent-boot.log
          grep -qxF "MadRust: boot OK" agent-boot.log
