# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build, lint, test and boot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-24
          components: rust-src, llvm-tools, rustfmt, clippy
          # The user program is a standard library program for Linux musl.
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio

      - name: Check formatting
        run: make fmt-check

      - name: Clippy
        run: make clippy

      - name: Clippy (host)
        run: make clippy-host

      - name: Host tests
        run: make test

      - name: Build kernel
        run: make build

      - name: Verify PVH ELF note
        run: |
          SYSROOT="$(rustc --print sysroot)"
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          READOBJ="$SYSROOT/lib/rustlib/$HOST/bin/llvm-readobj"
          "$READOBJ" --notes "$(make -s print-kernel-path)" | tee note.txt
          # The note owner and type are what QEMU looks for; the wording of the
          # tool output changes between LLVM releases, so match on the values.
          grep -q 'Xen' note.txt
          grep -q '0x00000012' note.txt

      - name: Boot kernel in QEMU
        run: |
          set +e
          # A broken kernel would hang here forever, so the boot is bounded.
          timeout 60 qemu-system-x86_64 -M q35 -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -display none -monitor none -no-reboot \
            -serial file:serial.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat serial.log
          test "$status" -eq 33
          # The kernel and the program write to the same serial port, and the
          # two interleave at the byte level: a line of the program can arrive
          # behind a line of the kernel. The prefix of the kernel is cut
          # before the exact matches, so the gate does not depend on where
          # the two streams meet.
          tr -d '\r' < serial.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > serial-clean.log
          grep -q "MadRust: boot OK" serial-clean.log
          # The kernel must run from the higher half and reach physical memory
          # through the direct map only.
          grep -q "0xffffffff80000000" serial-clean.log
          grep -q "MM DIRECTMAP OK" serial-clean.log
          grep -q "\[mem\] RAM" serial-clean.log
          grep -q "MEM OK" serial-clean.log
          grep -q "HEAP OK 10000" serial-clean.log
          # The user program prints through the write system call and exits
          # through exit_group; the kernel reports the status it received.
          grep -q "Hello from MadRust userland" serial-clean.log
          grep -q "USER OK exit=0" serial-clean.log
          grep -q "SCHED OK" serial-clean.log
          # Interleaving proof: every demo thread must appear in the log.
          grep -q "^T1 " serial-clean.log
          grep -q "^T2 " serial-clean.log
          grep -q "^T3 " serial-clean.log
          grep -q "DIV0" serial-clean.log
          grep -q "TICKS 100" serial-clean.log

      - name: Boot kernel with a network device
        run: |
          # The guest has no firmware, so the kernel enumerates the bus by
          # itself. This boot attaches a network device, runs a server on the
          # host and asserts that the guest resolves the gateway, sends one
          # datagram to the server and reads its answer. The same boot runs the
          # program the rig measures with: it opens a datagram socket of the ABI,
          # sends one datagram, waits for the echo and reports the round trip.
          # A second boot of the same server sends a request over a stream, so
          # the gate proves both halves of the network path.
          make netclient netstream

          # The server answers every datagram and every stream with the bytes it
          # received. It picks the port of each measurement itself, by binding
          # port zero, and writes the numbers it got: a second job on the same
          # runner binds different ones. The fixed port serves the demonstration
          # exchange the kernel makes on its own during boot.
          cat > "$RUNNER_TEMP/net-server.py" <<'PY'
          import select
          import socket
          import sys

          log_path, port_file, stream_port_file = sys.argv[1], sys.argv[2], sys.argv[3]
          PROBE_PORT = 9999


          def record(message):
              with open(log_path, "a") as handle:
                  handle.write(message + "\n")


          sockets = []
          measurement = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          measurement.bind(("127.0.0.1", 0))
          sockets.append(measurement)
          port = measurement.getsockname()[1]

          # The stream side of the same server: one TCP socket that accepts a
          # connection and echoes every request with the bytes it carried.
          stream = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          stream.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          stream.bind(("127.0.0.1", 0))
          stream.listen(8)
          stream_port = stream.getsockname()[1]
          connections = []

          probe = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          probe.bind(("127.0.0.1", PROBE_PORT))
          sockets.append(probe)
          record("server listening on port %d and on port %d" % (port, PROBE_PORT))
          record("server stream listening on port %d" % stream_port)
          with open(port_file, "w") as handle:
              handle.write("%d\n" % port)
          with open(stream_port_file, "w") as handle:
              handle.write("%d\n" % stream_port)

          while True:
              ready, _, _ = select.select(sockets + [stream] + connections, [], [])
              for server in ready:
                  if server is stream:
                      connection, address = stream.accept()
                      connections.append(connection)
                      record(
                          "stream accepted from %s:%d on port %d"
                          % (address[0], address[1], stream_port)
                      )
                      continue
                  if server in connections:
                      data = server.recv(2048)
                      if not data:
                          connections.remove(server)
                          server.close()
                          continue
                      record(
                          "stream got %d bytes from %s:%d on port %d: %r"
                          % (
                              len(data),
                              server.getpeername()[0],
                              server.getpeername()[1],
                              stream_port,
                              data,
                          )
                      )
                      server.sendall(data)
                      continue
                  data, address = server.recvfrom(2048)
                  record(
                      "server got %d bytes from %s:%d on port %d: %r"
                      % (len(data), address[0], address[1], server.getsockname()[1], data)
                  )
                  server.sendto(data, address)
          PY
          python3 "$RUNNER_TEMP/net-server.py" net-server.log \
            "$RUNNER_TEMP/net-server.port" "$RUNNER_TEMP/net-server-stream.port" &
          server=$!
          # Each archive carries the endpoint of this run, so the gate waits for
          # the server to name the ports it bound before it packs them.
          for _ in $(seq 300); do
            if [ -s "$RUNNER_TEMP/net-server.port" ] && \
               [ -s "$RUNNER_TEMP/net-server-stream.port" ]; then break; fi
            sleep 0.1
          done
          port="$(cat "$RUNNER_TEMP/net-server.port")"
          test -n "$port"
          echo "measurement port: $port"
          mkdir -p "$RUNNER_TEMP/netconf"
          printf 'address=10.0.2.2\nport=%s\ncount=1\n' "$port" \
            > "$RUNNER_TEMP/netconf/net.conf"
          EXTRA_DIR="$RUNNER_TEMP/netconf" sh bench/mkinitramfs.sh \
            "$RUNNER_TEMP/net.cpio" madrust-netclient/madrust-netclient.elf
          set +e
          timeout 60 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd "$RUNNER_TEMP/net.cpio" \
            -device virtio-net-pci,netdev=n0 -netdev user,id=n0 \
            -object filter-dump,id=dump0,netdev=n0,file=net.pcap \
            -display none -monitor none -no-reboot \
            -serial file:pci.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e

          # The stream half of the measurement: the same server, the same
          # device, the same flags, and the archive of the stream client with
          # the port the server bound for a stream.
          stream_port="$(cat "$RUNNER_TEMP/net-server-stream.port")"
          test -n "$stream_port"
          echo "stream port: $stream_port"
          mkdir -p "$RUNNER_TEMP/netstreamconf"
          printf 'address=10.0.2.2\nport=%s\ncount=1\n' "$stream_port" \
            > "$RUNNER_TEMP/netstreamconf/net.conf"
          EXTRA_DIR="$RUNNER_TEMP/netstreamconf" sh bench/mkinitramfs.sh \
            "$RUNNER_TEMP/netstream.cpio" madrust-netstream/madrust-netstream.elf
          set +e
          timeout 60 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd "$RUNNER_TEMP/netstream.cpio" \
            -device virtio-net-pci,netdev=n0 -netdev user,id=n0 \
            -display none -monitor none -no-reboot \
            -serial file:tcp.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          stream_status=$?
          echo "QEMU stream exit status: $stream_status"
          set -e

          # The server answers for as long as it runs, so it is stopped here and
          # not by itself.
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          cat net-server.log
          cat pci.log
          cat tcp.log
          test "$status" -eq 33
          test "$stream_status" -eq 33
          tr -d '\r' < pci.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > pci-boot.log
          # The server echoes what it received, so it must have got the
          # datagram of the kernel once per boot (the demonstration exchange)
          # and the two of the program: the warm up that takes the cost of the
          # address resolution out of the sample, and the sample itself.
          test "$(grep -c "server got 4 bytes from" net-server.log || true)" -eq 2
          grep -q "on port $port: b'ping-warmup'$" net-server.log
          grep -q "on port $port: b'ping-0'$" net-server.log
          grep -qxF "[net] udp send 10.0.2.15:49152 -> 10.0.2.2:9999 len=4" pci-boot.log
          grep -qxF '[net] udp recv 10.0.2.2:9999 -> 10.0.2.15:49152 len=4 data="ping"' pci-boot.log
          # The program opens a socket, connects it, sends and receives through
          # the calls of the ABI, and prints the round trip in microseconds with
          # the number of attempts it took. The gate takes one sample; the rig
          # takes the thirty the measurement is published with.
          grep -qE "^\[net\] udp send 10\.0\.2\.15:[0-9]+ -> 10\.0\.2\.2:$port len=11$" pci-boot.log
          grep -qE "^\[net\] udp recv 10\.0\.2\.2:$port -> 10\.0\.2\.15:[0-9]+ len=6 data=\"ping-0\"$" pci-boot.log
          grep -qE "^NET OK rt=[0-9]+ retries=[0-9]+ answer=ping-0$" pci-boot.log
          grep -qxF "NET DONE" pci-boot.log

          # One line per function that answers, with the vendor and the device
          # id as four hexadecimal digits each.
          grep -qE "^\[pci\] [0-9a-f]{2}:[0-9a-f]{2}\.[0-7] [0-9a-f]{4}:[0-9a-f]{4} class [0-9a-f]{6}$" pci-boot.log
          # The bridge of the host is an ICH9, and the revision of it
          # depends on the version of the emulator: 29c0 on one and 2918 on
          # another. The line has to name the device, not the revision.
          grep -qE "^\[pci\] 00:1f\.0 8086:29[0-9a-f]{2} " pci-boot.log
          grep -q " 1af4:1000 " pci-boot.log
          # The kernel claims the legacy port window of the card and reports
          # the base it assigned, the size the device asked for, the features
          # it offers and its hardware address. QEMU's address starts with
          # 52:54:00, the prefix of the host side of the emulated card.
          grep -qE "^\[virtio\] net base=0x[0-9a-f]{4} size=32 features=0x[0-9a-f]{8} mac=52:54:00(:[0-9a-f]{2}){3}$" pci-boot.log
          # The device is then brought up and given a ring per direction. The
          # legacy interface fixes the queue size, so the driver lays each
          # ring out for the number the device reports and both numbers of a
          # line are the same.
          grep -qE "^\[virtio\] queue 0 base=0x[0-9a-f]{12} descriptors=[0-9]+ max=[0-9]+$" pci-boot.log
          grep -qE "^\[virtio\] queue 1 base=0x[0-9a-f]{12} descriptors=[0-9]+ max=[0-9]+$" pci-boot.log
          # Frames are handed to the transmit queue: the address resolution
          # request, the datagram of the kernel and the datagram of the program.
          # The device reports each one back through the used ring, so the
          # counter of that ring reaches at least two.
          grep -qE "^\[virtio\] tx queue=1 desc=0 len=[0-9]+ used=1$" pci-boot.log
          grep -qE "^\[virtio\] tx queue=1 desc=0 len=[0-9]+ used=2$" pci-boot.log
          # The driver posts empty buffers into the receive queue before it
          # waits for an answer, and reports how many.
          grep -qE "^\[virtio\] rx queue=0 buffers=[0-9]+$" pci-boot.log
          # The answer of the gateway to the address resolution request is
          # read out of the receive queue and the hardware address it carries
          # is the one the datagram is addressed to.
          grep -qE "^\[net\] arp gateway=10\.0\.2\.2 mac=([0-9a-f]{2}:){5}[0-9a-f]{2}$" pci-boot.log
          grep -qxF "MadRust: boot OK" pci-boot.log
          # The frames must also leave the guest. The dump is written by the
          # emulator at the boundary of its user mode network, so it holds what
          # arrived there and what the host answered: the address resolution
          # request for the gateway, the reply of the gateway and the datagram
          # of the guest.
          PORT="$port" python3 - <<'PY'
          import os
          import struct
          import sys

          with open("net.pcap", "rb") as dump:
              data = dump.read()

          # A libpcap file: a magic number, then a header and the bytes of each
          # packet. QEMU writes the little endian variant.
          if data[:4] != b"\xd4\xc3\xb2\xa1":
              sys.exit("net.pcap is not a little endian libpcap file")
          offset = 24
          frames = []
          while offset + 16 <= len(data):
              _, _, captured, _ = struct.unpack("<IIII", data[offset : offset + 16])
              offset += 16
              frames.append(data[offset : offset + captured])
              offset += captured

          def arp(frame):
              # The type of an address resolution packet, Ethernet hardware on
              # IPv4. The operation tells the two directions apart below.
              if len(frame) < 42:
                  return None
              if frame[12:14] != b"\x08\x06" or frame[14:18] != b"\x00\x01\x08\x00":
                  return None
              return frame

          request = [
              frame
              for frame in frames
              if (arp(frame) is not None
                  and frame[0:6] == b"\xff" * 6
                  and frame[20:22] == b"\x00\x01"
                  and frame[28:32] == bytes([10, 0, 2, 15])
                  and frame[38:42] == bytes([10, 0, 2, 2]))
          ]
          if not request:
              sys.exit("no address resolution request for 10.0.2.2 reached the network")
          reply = [
              frame
              for frame in frames
              if (arp(frame) is not None
                  and frame[20:22] == b"\x00\x02"
                  and frame[28:32] == bytes([10, 0, 2, 2]))
          ]
          if not reply:
              sys.exit("the gateway did not answer the address resolution request")
          # The datagram of the guest: an IPv4 frame with the protocol of UDP,
          # the port of the guest, the port of the server and the bytes the
          # server reports.
          datagrams = [
              frame
              for frame in frames
              if (len(frame) >= 46
                  and frame[12:14] == b"\x08\x00"
                  and frame[14] >> 4 == 4
                  and frame[23] == 17
                  and frame[34:36] == struct.pack(">H", 49152)
                  and frame[36:38] == struct.pack(">H", 9999)
                  and frame[42:46] == b"ping")
          ]
          if not datagrams:
              sys.exit("the datagram of the guest did not reach the network")
          # The datagram the program of the guest measured: same shape, with the
          # port the server of this run bound and the payload of the sample.
          port = int(os.environ["PORT"])
          measured = [
              frame
              for frame in frames
              if (len(frame) >= 48
                  and frame[12:14] == b"\x08\x00"
                  and frame[14] >> 4 == 4
                  and frame[23] == 17
                  and frame[36:38] == struct.pack(">H", port)
                  and frame[42:48] == b"ping-0")
          ]
          if not measured:
              sys.exit("the measured datagram did not reach the network")
          print("NET FRAME OK sent=%d received=%d measured=%d"
                % (len(request[0]), len(frames), len(measured)))
          PY

          # The stream boot: the client connects, requests and reads the answer
          # through the calls of the ABI, and the kernel reports the segments of
          # the connection. The server of the host saw the request byte for
          # byte, and the answer is the request it echoed.
          tr -d '\r' < tcp.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > tcp-boot.log
          grep -qxF "MadRust: boot OK" tcp-boot.log
          grep -qE "^\[net\] tcp send 10\.0\.2\.15:[0-9]+ -> 10\.0\.2\.2:$stream_port flags=0x18 seq=[0-9]+ ack=[0-9]+ len=8 data=\"stream-0\"$" tcp-boot.log
          grep -qE "^\[net\] tcp recv 10\.0\.2\.2:$stream_port -> 10\.0\.2\.15:[0-9]+ flags=0x18 seq=[0-9]+ ack=[0-9]+ len=8 data=\"stream-0\"$" tcp-boot.log
          grep -qE "^NET STREAM OK rt=[0-9]+ retries=[0-9]+ answer=stream-0$" tcp-boot.log
          grep -qxF "NET STREAM DONE" tcp-boot.log
          grep -q "on port $stream_port: b'stream-warmup'$" net-server.log
          grep -q "on port $stream_port: b'stream-0'$" net-server.log

      - name: Boot kernel with four processors
        run: |
          # The multiprocessor path has its own race, so it is a gate of its
          # own and not a variation of the single processor boot.
          set +e
          timeout 120 qemu-system-x86_64 -M q35 -cpu Skylake-Client -smp 4 -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -display none -monitor none -no-reboot \
            -serial file:smp.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat smp.log
          # The exit status of the emulator is the code the kernel writes to
          # the debug exit port: 33 means the boot reached its end. The shell
          # must not stop on that number, or the gate fails on a good boot.
          test "$status" -eq 33
          grep -q "SMP processors=4" smp.log
          grep -q "SMP OK cpus=4" smp.log

      - name: Boot kernel with the initramfs
        run: |
          # The weights workload touches the whole region it measures, so the
          # CI builds it with a small region to finish under emulation.
          make bench BENCH_FEATURES=small
          sh bench/mkinitramfs.sh
          expected="$(wc -c < madrust-bench/madrust-bench.elf | tr -d ' ')"
          set +e
          # The benchmark workload touches 256 MiB five times, so this boot is
          # slower than the bare one under emulation.
          timeout 300 qemu-system-x86_64 -M q35 -m 512M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd bench/initramfs.cpio \
            -display none -monitor none -no-reboot \
            -serial file:initramfs.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat initramfs.log
          test "$status" -eq 33
          # Normalise the CRLF of the kernel lines and cut the prefix of the
          # kernel log: the workload and the kernel share the serial port and
          # their lines can meet.
          tr -d '\r' < initramfs.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > initramfs-boot.log
          # One module, and as many files and entries as the archive holds: the
          # count changes when the archive gains alignment files.
          grep -qE "^\[user\] initramfs: 1 module, [0-9]+ files, [0-9]+ entries$" initramfs-boot.log
          grep -qxF "FILE size=$expected" initramfs-boot.log
          grep -qxF "FILE mode=33261" initramfs-boot.log
          grep -qxF "FILE path-size=$expected" initramfs-boot.log
          grep -qxF "FILE read=$expected" initramfs-boot.log
          grep -qxF "FILE seek=$expected" initramfs-boot.log
          grep -qxF "FILE missing=-2" initramfs-boot.log
          grep -qxF "BENCH DONE" initramfs-boot.log
          # The file mapping covers the file rounded down to whole pages, and
          # the first byte of the file is the ELF magic.
          grep -qxF "FILE mmap=$(( expected / 4096 * 4096 ))" initramfs-boot.log
          grep -qxF "FILE mmap-byte=127" initramfs-boot.log
          grep -q "large pages mapped" initramfs-boot.log
          # Every sample still prints, with the count each workload owes.
          declare -A samples=(
            [syscall]=30 [mmap]=30 [futex]=30 [threads]=30
            [weights]=5 [weights-tail]=5 [weights-huge]=10 [weights-huge-tail]=10
          )
          total=0
          for workload in "${!samples[@]}"; do
            count="$(grep -c "^RESULT $workload " initramfs-boot.log || true)"
            echo "$workload: $count samples"
            test "$count" -eq "${samples[$workload]}"
            total=$((total + count))
          done
          test "$total" -eq "$(grep -c '^RESULT ' initramfs-boot.log)"
          grep -qxF "USER OK exit=0" initramfs-boot.log
          grep -qxF "MadRust: boot OK" initramfs-boot.log

      - name: Boot the inference runtime in the guest
        run: |
          # The runtime serves a model from the initramfs and prints the
          # tokens it generated. The gate is that the runtime runs inside the
          # guest and answers, not that the answer is good: the model of this
          # run is the synthetic one.
          make infer infer-model infer-initramfs
          set +e
          timeout 300 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 1024M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd madrust-infer/initramfs.cpio \
            -display none -monitor none -no-reboot \
            -serial file:infer.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat infer.log
          test "$status" -eq 33
          # The kernel writes its lines with a carriage return at the end and
          # the program writes its lines without one, so the log has both.
          tr -d '\r' < infer.log > infer-boot.log
          grep -q "^INFER OK" infer-boot.log
          grep -q "^INFER ttft_ms " infer-boot.log
          grep -q "^INFER tok_per_s " infer-boot.log
          grep -qxF "MadRust: boot OK" infer-boot.log

      - name: Run the agent loop in the guest
        run: |
          # The agent is the fourth program: it asks the model for a tool
          # call, runs the tool and goes on. The gate is that the loop runs
          # and reports, not that the model decides well: the model of this
          # run is the synthetic one, whose answers are arbitrary.
          make agent agent-initramfs
          set +e
          timeout 600 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 1024M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd madrust-agent/initramfs.cpio \
            -display none -monitor none -no-reboot \
            -serial file:agent.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          cat agent.log
          test "$status" -eq 33
          # The kernel writes its lines with a carriage return at the end and
          # the program writes its lines without one, so the log has both.
          tr -d '\r' < agent.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > agent-boot.log
          # Every step of the loop reports its tool and its result, and the
          # run ends with the summary the rig reads.
          grep -q "^AGENT step=1 tool=" agent-boot.log
          grep -qE "^AGENT steps=[0-9]+ tokens=[0-9]+ seconds=[0-9.]+ tool_calls=[0-9]+$" agent-boot.log
          grep -qxF "MadRust: boot OK" agent-boot.log

      - name: Run the agent against the network
        run: |
          # The agent reaches the server of the host with the network tool and
          # reports the answer. The model of this run is the synthetic one,
          # which decides nothing sensible, so the gate does not wait for it to
          # choose the tool: the archive carries `selftest=1` and the agent
          # calls the tool once before it asks the model, through the same code
          # path and with the same arguments. The gate checks that line, and
          # says which way proved the tool.
          make agent

          # The echo server of the host. It picks the port of this run by
          # binding port zero, and the fixed port serves the demonstration the
          # kernel makes on its own during boot.
          cat > "$RUNNER_TEMP/agent-net-server.py" <<'PY'
          import select
          import socket
          import sys

          log_path, port_file = sys.argv[1], sys.argv[2]
          PROBE_PORT = 9999


          def record(message):
              with open(log_path, "a") as handle:
                  handle.write(message + "\n")


          sockets = []
          measurement = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          measurement.bind(("127.0.0.1", 0))
          sockets.append(measurement)
          port = measurement.getsockname()[1]

          try:
              probe = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              probe.bind(("127.0.0.1", PROBE_PORT))
              sockets.append(probe)
          except OSError:
              pass
          record("server listening on port %d" % port)
          with open(port_file, "w") as handle:
              handle.write("%d\n" % port)

          while True:
              ready, _, _ = select.select(sockets, [], [])
              for server in ready:
                  data, address = server.recvfrom(2048)
                  record(
                      "server got %d bytes from %s:%d on port %d: %r"
                      % (len(data), address[0], address[1], server.getsockname()[1], data)
                  )
                  server.sendto(data, address)
          PY
          python3 "$RUNNER_TEMP/agent-net-server.py" agent-net-server.log \
            "$RUNNER_TEMP/agent-net-server.port" &
          server=$!
          for _ in $(seq 300); do
            if [ -s "$RUNNER_TEMP/agent-net-server.port" ]; then break; fi
            sleep 0.1
          done
          port="$(cat "$RUNNER_TEMP/agent-net-server.port")"
          test -n "$port"
          echo "agent network port: $port"
          # The address and the port reach the agent through a file of the
          # archive: neither kernel passes arguments to the program it runs.
          make agent-net-initramfs AGENT_NET_PORT="$port"
          set +e
          timeout 600 qemu-system-x86_64 -M q35 -cpu Skylake-Client -m 1024M \
            -kernel "$(make -s print-kernel-path)" \
            -initrd madrust-agent/initramfs-net.cpio \
            -device virtio-net-pci,netdev=n0 -netdev user,id=n0 \
            -display none -monitor none -no-reboot \
            -serial file:agent-net.log \
            -device isa-debug-exit,iobase=0xf4,iosize=0x04
          status=$?
          echo "QEMU exit status: $status"
          set -e
          kill "$server" 2>/dev/null || true
          wait "$server" 2>/dev/null || true
          cat agent-net-server.log
          cat agent-net.log
          test "$status" -eq 33
          tr -d '\r' < agent-net.log | sed -E 's/^\[[[:space:]]*[0-9]+\.[0-9]+\][[:space:]]*//' > agent-net-boot.log
          # The deterministic call of the tool: the same path the model uses,
          # with the endpoint of this run, and the answer of the server in the
          # result line.
          grep -qE "^AGENT selftest tool=net_send args={\"query\":\"10\.0\.2\.2:$port\",\"text\":\"ping-agent\"} result=answer=ping-agent bytes=10 retries=[0-9]+ rt_us=[0-9]+" agent-net-boot.log
          # The server saw the datagram of the guest and echoed it.
          grep -q "on port $port: b'ping-agent'" agent-net-server.log
          # The round trip is on the summary of the run, because the tool runs
          # inside the run: the seconds of the agent carry it.
          grep -qE "^AGENT steps=[0-9]+ tokens=[0-9]+ seconds=[0-9.]+ tool_calls=[0-9]+ net_us=[0-9]+ retries=[0-9]+$" agent-net-boot.log
          grep -qxF "AGENT DONE" agent-net-boot.log
          grep -qxF "MadRust: boot OK" agent-net-boot.log
          # A model that chooses the network tool is a second proof, not the
          # proof: the synthetic checkpoint is free to choose something else,
          # and the gate must pass on the deterministic call alone.
          if grep -qE "^AGENT step=[0-9]+ tool=net_send .*result=answer=" agent-net-boot.log; then
            echo "network tool proven by: the selftest and a step the model chose"
          else
            echo "network tool proven by: the deterministic selftest (the synthetic model chose no network call)"
          fi
